# Example: GitHub Actions → cloud credentials via OIDC (no long-lived keys).
# Copy into the target repo's .github/workflows/ and adapt roles, cloud, and
# job steps. This file is a pattern, not a runnable workflow for this harness
# repository (which has no Terraform/AWS apply jobs of its own).
#
# Required GitHub configuration:
# - Cloud IdP trust (e.g. AWS IAM OIDC provider for token.actions.githubusercontent.com)
# - Role trust policy scoped with aud + sub (repo, environment, and/or branch)
# See .github/skills/coding/security-hardening.md.

name: example-oidc-secrets-injection

on:
  workflow_dispatch:
  # pull_request:  # enable in the target repo when the role trust allows PRs from this repository

permissions:
  contents: read
  id-token: write   # required for OIDC; do not use a stored AWS_SECRET_ACCESS_KEY

jobs:
  example:
    runs-on: ubuntu-latest
    # Pin to a GitHub Environment whose protection rules match the IAM role's sub condition
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AWS example — replace with azure/login or google-github-actions/auth as needed.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-staging
          aws-region: us-east-1
          # role-session-name: github-actions-${{ github.run_id }}

      - name: Prove identity (no secret values printed)
        run: aws sts get-caller-identity
