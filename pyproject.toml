[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-agent-harness"
version = "0.2.0"
description = "Issue-driven coordination harness for platform engineering agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
repo-issue = "platform_harness.cli:main"

[tool.setuptools]
package-dir = { "" = "setup" }

[tool.setuptools.packages.find]
where = ["setup"]
include = ["platform_harness*"]

[tool.setuptools.package-data]
platform_harness = ["py.typed"]
